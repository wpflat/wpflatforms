name: Release

# Push a tag like v0.1.0 (it must match the "Version:" line in wpflatforms.php) and this attaches an installable zip to a GitHub release.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: wpflatforms

      - name: Check the tag matches the plugin version
        run: |
          V=$(grep -m1 '^ \* Version:' wpflatforms/wpflatforms.php | awk '{print $3}')
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Version: $V in wpflatforms.php" >&2
            exit 1
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Build the zip (the plugin folder, without development files)
        run: |
          zip -rq "wpflatforms-$VERSION.zip" wpflatforms \
            -x "wpflatforms/.git/*" "wpflatforms/.github/*" "wpflatforms/.gitignore" "wpflatforms/ui/*" "wpflatforms/vite*.js" "wpflatforms/package*.json" "wpflatforms/API.md" \
               "wpflatforms/node_modules/*" "wpflatforms/lib/dompdf/tests/*" '*.DS_Store'
          cp "wpflatforms-$VERSION.zip" wpflatforms.zip   # a stable name, so .../releases/latest/download/wpflatforms.zip always works
          unzip -l wpflatforms.zip | tail -1

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            wpflatforms-${{ env.VERSION }}.zip
            wpflatforms.zip
          generate_release_notes: true
